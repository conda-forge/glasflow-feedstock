{% set name = "glasflow" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/glasflow-{{ version }}.tar.gz
  sha256: 64b6794bc2a481338d50b539ac01a2befd0785e3f7f30683a5e9a6584c26065d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=64.0.3
    - setuptools-scm
  run:
    - numpy
    - python >={{ python_min }}
    - pytorch >=1.11.0

test:
  requires:
    - pip
    - pytest >=6.0.0
    - pytest-requires
    - pytest-rerunfailures
    - python {{ python_min }}
  imports:
    - glasflow
  source_files:
    - tests
    - pyproject.toml
  commands:
    - pip check
    - python -m pytest tests/ -vv

about:
  home: https://github.com/igr-ml/glasflow
  summary: Normalising flows using nflows
  description: |
    glasflow is a Python library containing a collection of normalising flows
    implemented using PyTorch and nflows.
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  dev_url: https://github.com/igr-ml/glasflow

extra:
  recipe-maintainers:
    - johnveitch
    - mj-will
